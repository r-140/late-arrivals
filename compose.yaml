services:
  postgres:
    image: postgres:16.8
    command: [postgres, -c, wal_level=logical]
    environment: {POSTGRES_USER: lab, POSTGRES_PASSWORD: lab, POSTGRES_DB: lab}
    volumes: [pg:/var/lib/postgresql/data, ./infra/source.sql:/docker-entrypoint-initdb.d/source.sql:ro]
    ports: ["127.0.0.1:${LAB_POSTGRES_PORT:-15432}:5432"]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U lab"], interval: 5s, retries: 30}
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: [kafka:/tmp/kraft-combined-logs]
  connect:
    image: quay.io/debezium/connect:3.0.0.Final
    depends_on: {postgres: {condition: service_healthy}, kafka: {condition: service_started}}
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: lab-connect
      CONFIG_STORAGE_TOPIC: lab-connect-config
      OFFSET_STORAGE_TOPIC: lab-connect-offsets
      STATUS_STORAGE_TOPIC: lab-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
    ports: ["127.0.0.1:${LAB_CONNECT_PORT:-18083}:8083"]
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment: {CLICKHOUSE_DB: lab, CLICKHOUSE_USER: lab, CLICKHOUSE_PASSWORD: lab, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'}
    ports: ["127.0.0.1:${LAB_CLICKHOUSE_PORT:-18123}:8123"]
    volumes: [ch:/var/lib/clickhouse, ./infra/bronze.sql:/docker-entrypoint-initdb.d/bronze.sql:ro]
  worker:
    build: .
    depends_on: [connect, clickhouse]
    ports: ["127.0.0.1:${LAB_METRICS_PORT:-19101}:9101"]
    volumes: [./control:/app/control, ./dbt:/app/dbt]
    restart: unless-stopped
  airflow:
    build: {context: ., dockerfile: Dockerfile.airflow}
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/lab/airflow/dags
    volumes: [./:/opt/lab, airflow:/opt/airflow]
    ports: ["127.0.0.1:${LAB_AIRFLOW_PORT:-18080}:8080"]
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes: [./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:${LAB_PROMETHEUS_PORT:-19090}:9090"]
  grafana:
    image: grafana/grafana:11.6.0
    environment: {GF_SECURITY_ADMIN_PASSWORD: lab, GF_INSTALL_PLUGINS: grafana-clickhouse-datasource}
    volumes: [./grafana/provisioning:/etc/grafana/provisioning:ro, ./grafana/dashboards:/var/lib/grafana/dashboards:ro]
    ports: ["127.0.0.1:${LAB_GRAFANA_PORT:-13000}:3000"]
volumes: {pg: {}, ch: {}, kafka: {}, airflow: {}}
